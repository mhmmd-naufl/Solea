name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Frontend: lint + build. Tidak butuh secret.
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Lint + build
        run: npm run check

  # Backend: cek sintaks, smoke test import, dan pastikan tidak ada
  # kredensial yang ikut ter-commit. Tidak butuh secret.
  backend:
    name: Backend (compile + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependency
        run: pip install -r requirements.txt

      - name: Cek sintaks semua file Python
        run: python -m py_compile main.py analytics.py config.py notifications.py payments.py seed_direct.py

      - name: Smoke test import aplikasi
        env:
          SUPABASE_URL: https://ci-smoke-test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key-untuk-smoke-test-123456
          JWT_SECRET_KEY: ci-dummy-jwt-secret-untuk-smoke-test-1234567890
        run: |
          python -c "import main; paths = main.app.openapi()['paths']; print(f'{len(paths)} endpoint terdaftar'); assert len(paths) >= 40, 'Jumlah endpoint tidak sesuai'"

      - name: Pastikan tidak ada secret yang ter-commit
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=.env::.env ikut ter-commit. Hapus dari repo!"
            exit 1
          fi
          echo "Aman: .env tidak ada di repo."

      - name: Pastikan folder privat/ tidak ikut ter-commit
        run: |
          if git ls-files --error-unmatch privat >/dev/null 2>&1; then
            echo "::error file=privat::Folder privat/ ikut ter-commit ke repo publik!"
            exit 1
          fi
          echo "Aman: folder privat/ tidak ada di repo."
