name: Deploy Backend to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secret Fly dikelola dari dashboard Fly.io, bukan dari repo.
      # Kalau token tidak tersedia, deploy dilewati (bukan gagal) agar
      # status CI tetap hijau; deploy bisa dilakukan manual dari dashboard.
      - name: Cek apakah token Fly tersedia
        id: gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy dilewati::Secret FLY_API_TOKEN belum diisi di GitHub. Deploy backend bisa dilakukan manual dari dashboard Fly.io."
          fi

      - name: Install Fly CLI
        if: steps.gate.outputs.available == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: steps.gate.outputs.available == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
