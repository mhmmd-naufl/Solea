name: Deploy Backend to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Fly CLI
        run: |
          curl -fsSL https://fly.io/get-cli | sh -
          sudo mv ./flyctl /usr/local/bin/flyctl

      - name: Authenticate
        run: flyctl auth docker

      - name: Set secrets
        run: flyctl secrets set SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
        working-directory: .

      - name: Deploy
        run: flyctl deploy --remote-remote-apps --strategy rolling
        working-directory: .
